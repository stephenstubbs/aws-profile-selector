[package]
name = "aws-profile-selector"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Interactive AWS profile selector CLI tool"
license = "MIT"
repository = "https://github.com/stephenstubbs/aws-profile-selector"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
inquire = { version = "0.9.5", default-features = false, features = ["crossterm", "fuzzy"] }
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
